pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'handig'

// De kern en alle modules (een module telt mee zodra hij een fabric.mod.json heeft).
['kern', 'kistdb', 'gereedschap', 'wegwijzer', 'info', 'gemak', 'graf', 'verzamelaar', 'naam', 'gebied', 'glans'].each { m ->
	if (file("${m}/src/main/resources/fabric.mod.json").exists()) include m
}
// Alleen voor de CI: draait alle modules samen op een echte server met zelftests.
include 'testserver'
