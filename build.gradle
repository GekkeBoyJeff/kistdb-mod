plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'java-library'

	group = rootProject.group
	base.archivesName = project.findProperty("archives_name_${project.name}") ?: project.name
	version = project.findProperty("version_${project.name}") ?: rootProject.version

	repositories {
		maven { url 'https://maven.nucleoid.xyz/' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	}

	processResources {
		def v = project.version
		def core = rootProject.project(':core').version
		inputs.property "version", v
		inputs.property "core", core
		filesMatching("fabric.mod.json") {
			expand "version": v, "core_version": core
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		from(rootProject.file("LICENSE")) { rename { "LICENSE_libreria" } }
	}
}
