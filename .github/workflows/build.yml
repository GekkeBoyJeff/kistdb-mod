name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          # Gradle's own download sometimes times out: try it a few times before the build
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon > /dev/null 2>&1 && break; echo "Gradle download failed, try $i"; sleep 20; done
          ./gradlew build --continue --stacktrace --no-daemon 2>&1 | tee build.log
      - name: smoke test (start a real 26.3 server)
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p testserver/run
          echo "eula=true" > testserver/run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nmax-tick-time=-1\n' > testserver/run/server.properties
          ./gradlew :testserver:runServer --no-daemon > server.log 2>&1 &
          for i in $(seq 1 100); do
            if grep -qE 'LIBRERIA-SELFTEST (OK|FAIL) ' server.log; then sleep 3; break; fi
            if grep -qE 'Crash report|Failed to start the minecraft server|Exception in server tick loop|BUILD FAILED' server.log; then break; fi
            sleep 5
          done
          pkill -9 -f java || true
          grep -E 'LIBRERIA-SELFTEST|loaded|Mixin|ERROR|Exception' server.log | head -80
          grep -q 'LIBRERIA-SELFTEST OK' server.log
      - name: screenshots (start a real 26.3 client)
        id: shots
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 > /dev/null
          mkdir -p testclient/build/run/clientGameTest
          echo 'preferredGraphicsBackend:"opengl"' > testclient/build/run/clientGameTest/options.txt
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :testclient:runClientGameTest --no-daemon > client.log 2>&1 || true
          grep -E 'LIBRERIA-SCREENSHOTS|Screenshot step|ERROR|Exception|Caused by' client.log | head -60
          ls testclient/build/run/clientGameTest/screenshots | head -80
          grep -q 'LIBRERIA-SCREENSHOTS DONE' client.log
      - name: collect output
        if: always()
        run: |
          mkdir -p out
          cp server.log out/ 2>/dev/null || true
          echo "${{ steps.smoke.outcome }}" > out/smoke.txt
          cp build.log out/ || true
          echo "${{ steps.build.outcome }}" > out/status.txt
          echo "${GITHUB_SHA}" > out/commit.txt
          for m in core chests tools waypoints info comfort graves collector nicknames claims glint teleports waystones refresh; do cp $m/build/libs/*.jar out/ 2>/dev/null || true; done
          cp testserver/run/polymer/resource_pack.zip out/ 2>/dev/null || true
          mkdir -p out/screenshots
          cp testclient/build/run/clientGameTest/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp client.log out/ 2>/dev/null || true
          cp testclient/build/run/clientGameTest/logs/latest.log out/client-latest.log 2>/dev/null || true
          echo "${{ steps.shots.outcome }}" > out/shots.txt
          rm -f out/*-sources.jar
          bash .github/probe.sh
      - name: publish to ci-out branch
        if: always()
        run: |
          cd out
          git init -q -b ci-out
          git config user.name "libreria-ci"
          git config user.email "libreria-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI ${GITHUB_SHA} (${{ steps.build.outcome }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-out
      - uses: actions/upload-artifact@v7
        if: steps.build.outcome == 'success'
        with:
          name: Libreria
          path: out/*.jar
